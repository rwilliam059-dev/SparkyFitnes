name: Format Nutrition Tip Once

on:
  push:
    branches: [feat/nutrition-goal-tips]
    paths:
      - ".github/workflows/format-nutrition-tip-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: [self-hosted, linux, x64, wiwi-dedicated]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nutrition-goal-tips
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir SparkyFitnessFrontend exec prettier src/pages/Diary/NutritionSummaryCard.tsx --write
          rm .github/workflows/format-nutrition-tip-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SparkyFitnessFrontend/src/pages/Diary/NutritionSummaryCard.tsx .github/workflows/format-nutrition-tip-once.yml
          git commit -m "style: format nutrition goal tips"
          git push origin HEAD:feat/nutrition-goal-tips
