name: CI Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "SparkyFitnessFrontend/**"
      - "SparkyFitnessMobile/**"
      - "SparkyFitnessServer/**"
      - "SparkyFitnessGarmin/**"
      - ".github/workflows/ci-tests.yml"
  push:
    branches: [main]
    paths:
      - "SparkyFitnessFrontend/**"
      - "SparkyFitnessMobile/**"
      - "SparkyFitnessServer/**"
      - "SparkyFitnessGarmin/**"
      - ".github/workflows/ci-tests.yml"

concurrency:
  group: sparky-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: [self-hosted, linux, x64, wiwi-dedicated]
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      server: ${{ steps.filter.outputs.server }}
      garmin: ${{ steps.filter.outputs.garmin }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check for changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            frontend:
              - 'SparkyFitnessFrontend/**'
            mobile:
              - 'SparkyFitnessMobile/**'
            server:
              - 'SparkyFitnessServer/**'
            garmin:
              - 'SparkyFitnessGarmin/**'
            migrations:
              - 'SparkyFitnessServer/db/migrations/**'
              - 'SparkyFitnessServer/db/rls_policies.sql'
              - 'SparkyFitnessServer/db/grantPermissions.ts'
              - 'SparkyFitnessServer/utils/dbMigrations.ts'
              - 'SparkyFitnessServer/utils/applyRlsPolicies.ts'
              - 'SparkyFitnessServer/tests/migrate.script.ts'
              - 'SparkyFitnessServer/tests/rlsPermissionMatrix.integration.test.ts'
              - 'SparkyFitnessServer/package.json'
              - '.github/workflows/ci-tests.yml'

  frontend-tests:
    name: Frontend Tests
    runs-on: [self-hosted, linux, x64, wiwi-dedicated]
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Show formatted French overrides
        working-directory: SparkyFitnessFrontend
        run: |
          pnpm exec prettier src/i18n/frOverrides.ts --write
          echo '---BEGIN-FR-OVERRIDES---'
          cat src/i18n/frOverrides.ts
          echo '---END-FR-OVERRIDES---'
      - name: Validate
        working-directory: SparkyFitnessFrontend
        run: pnpm run validate
      - name: Tests
        working-directory: SparkyFitnessFrontend
        run: pnpm run test:ci
        env:
          NODE_ENV: test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: SparkyFitnessFrontend/coverage/
          retention-days: 7

  mobile-tests:
    name: Mobile Tests
    runs-on: [self-hosted, linux, x64, wiwi-dedicated]
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    defaults:
      run:
        working-directory: SparkyFitnessMobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate
        run: pnpm run validate
      - name: Tests
        run: pnpm run test:ci
        env:
          NODE_ENV: test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-coverage
          path: SparkyFitnessMobile/coverage/
          retention-days: 7

  server-tests:
    name: Server Tests
    runs-on: [self-hosted, linux, x64, wiwi-dedicated]
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.server == 'true'
    defaults:
      run:
        working-directory: SparkyFitnessServer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate
        run: pnpm run validate
      - name: Tests
        run: pnpm run test:ci
        env:
          NODE_ENV: test
          SKIP_RLS_MATRIX: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage
          path: SparkyFitnessServer/coverage/
          retention-days: 7

  migration-check:
    name: Fresh-install Migrations
    runs-on: [self-hosted, linux, x64, wiwi-dedicated]
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    defaults:
      run:
        working-directory: SparkyFitnessServer
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sparky_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply migrations twice
        run: pnpm run test:migrations && pnpm run test:migrations
        env: &db-env
          SPARKY_FITNESS_DB_HOST: localhost
          SPARKY_FITNESS_DB_PORT: "5432"
          SPARKY_FITNESS_DB_NAME: sparky_test
          SPARKY_FITNESS_DB_USER: postgres
          SPARKY_FITNESS_DB_PASSWORD: postgres
          SPARKY_FITNESS_APP_DB_USER: sparky_app
          SPARKY_FITNESS_APP_DB_PASSWORD: sparky_app_pw
      - name: Verify RLS permission matrix
        run: pnpm exec vitest run tests/rlsPermissionMatrix.integration.test.ts
        env: *db-env

  migration-upgrade-check:
    name: Upgrade-path Migrations
    runs-on: [self-hosted, linux, x64, wiwi-dedicated]
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    defaults:
      run:
        working-directory: SparkyFitnessServer
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sparky_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply base migrations, then current migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SPARKY_FITNESS_DB_HOST: localhost
          SPARKY_FITNESS_DB_PORT: "5432"
          SPARKY_FITNESS_DB_NAME: sparky_test
          SPARKY_FITNESS_DB_USER: postgres
          SPARKY_FITNESS_DB_PASSWORD: postgres
          SPARKY_FITNESS_APP_DB_USER: sparky_app
          SPARKY_FITNESS_APP_DB_PASSWORD: sparky_app_pw
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::notice::No valid base commit; skipping upgrade-path check."
            exit 0
          fi
          rm -rf db/migrations db/rls_policies.sql
          git checkout "${BASE_SHA}" -- db/migrations db/rls_policies.sql
          pnpm run test:migrations
          rm -rf db/migrations db/rls_policies.sql
          git checkout HEAD -- db/migrations db/rls_policies.sql
          pnpm run test:migrations

  garmin-tests:
    name: Garmin Tests
    runs-on: [self-hosted, linux, x64, wiwi-dedicated]
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.garmin == 'true'
    defaults:
      run:
        working-directory: SparkyFitnessGarmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest pytest-cov
      - name: Tests
        continue-on-error: true
        run: |
          if [ -d tests ] || [ -f test_*.py ]; then
            pytest --cov=. --cov-report=xml --cov-report=html
          else
            echo "No tests found, skipping..."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garmin-coverage
          path: SparkyFitnessGarmin/htmlcov/
          retention-days: 7